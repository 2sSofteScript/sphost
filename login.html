<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
    <title>Login | SpHost Service</title>
</head>

<body>
    <main id="tela-login-registror-container">
        <div class="interface" id="login">
            <section class="tela-login">
                <h1>Faça seu <span> login</span></h1>

                <form action="#">
                    <input type="email" name="email" placeholder="Digite seu e-mail">
                    <input type="password" name="senha" id="senha" placeholder="Digite sua senha">

                    <a href="/index.html">Esqueceu a senha?</a>
                    <input type="submit" value="Fazer login">
                </form>

                <article class="opt-login">
                    <p>Ou faça login usando:</p>
                    <div class="btn-opt-login">
                        <button><img src="img/google-brands-solid.png" alt="logotipo Google"></button>
                        <button><img src="img/facebook-brands-solid.png" alt="logotipo Facebook"></button>
                        <button><img src="img/apple-brands-solid.png" alt="logotipo Apple"></button>
                    </div>

                </article>

                <article class="txt-criar-conta-login">
                    <p>Não tem conta? <a href="/index.html" id="btn-registro">Crie uma agora</a></p>
                </article>
            </section>
            <section class="img-decoracao img-login"></section>
        </div>

    </main>
</body>

</html>
